name: "🤖 Android APK Build (Local)"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  EXPO_NAME: workout-tracker

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Setup Expo
        run: npm install -g expo-cli

      - name: 🏗️ Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: 📁 Setup build directory
        run: mkdir -p builds/android

      - name: 🔨 Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 📋 Copy APK to builds folder
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk builds/android/${EXPO_NAME}.apk
          echo "APK built successfully"
          ls -lh builds/android/

      - name: 📤 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: builds/android/${{ env.EXPO_NAME }}.apk
          retention-days: 14

      - name: 📊 Build summary
        run: |
          echo "### 📱 Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "builds/android/${EXPO_NAME}.apk" ]; then
            echo "**File:** ${EXPO_NAME}.apk" >> $GITHUB_STEP_SUMMARY
            echo "**Size:** $(du -h builds/android/${EXPO_NAME}.apk | cut -f1)" >> $GITHUB_STEP_SUMMARY
            echo "**Status:** ✅ Ready to install!" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Download:** Actions 탭 > Artifacts에서 다운로드" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
